<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOXY CSE</title>
  <style>
    /* ===== Base ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #fff, #f5f5f5);
      color: #333;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* ===== Header ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.9);
      position: sticky;
      top: 0;
      z-index: 2000;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      animation: slideInHeader 0.8s ease-out;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 2100;
    }

    #logo {
      height: 50px;
      width: auto;
      border-radius: 8px;
      background-color: #fff;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
    }

    #logo:hover {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 1.6em;
      color: #ffa500;
      margin: 0;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 2100;
    }

    nav ul li a {
      color: #ffa500;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1em;
      transition: color 0.3s ease-in-out, transform 0.3s ease-in-out;
      position: relative;
      z-index: 2100;
    }

    nav ul li a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== Email Button ===== */
    .email {
      display: inline-block;
      color: #fff;
      font-size: 16px;
      text-decoration: none;
      background: #ffa500;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      transition: background 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      z-index: 2100;
    }

    .email:hover {
      background: #cc8400;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    /* ===== Parallax Sections ===== */
    .parallax {
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      position: relative;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      z-index: 1000;
      overflow: hidden;
    }

    @supports (-webkit-touch-callout: none) {
      .parallax {
        background-attachment: scroll;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      transition: opacity 0.4s ease-in-out;
      z-index: 1100;
    }

    .parallax:hover .overlay {
      opacity: 0.5;
    }

    .parallax .content,
    .hero-content {
      position: relative;
      z-index: 1200;
      padding: 30px;
      opacity: 0;
      animation: fadeInContent 1.2s ease-out forwards;
    }

    .parallax h2 {
      font-size: 2.5em;
      color: #ffa500;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease-in-out;
    }

    .parallax:hover h2 {
      transform: scale(1.03);
    }

    .parallax p {
      font-size: 1.2em;
      margin-bottom: 20px;
      transition: transform 0.3s ease-in-out;
    }

    .parallax:hover p {
      transform: translateY(-3px);
    }

    .highlight {
      color: #ffa500;
      font-weight: 700;
      animation: glow 1.8s ease-in-out infinite;
    }

    /* ===== Hero Button (Follow us on Instagram) ===== */
    .btn {
      background: #ffa500;
      color: #000;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      z-index: 2100;
      transition: background 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      animation: pulseGlow 1.8s ease-in-out infinite;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease-in-out, height 0.4s ease-in-out;
      z-index: 2101;
    }

    .btn:hover::before {
      width: 200%;
      height: 200%;
    }

    .btn:hover {
      background: #cc8400;
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* ===== Gallery ===== */
    #gallery {
      background: #f5f5f5;
      padding: 80px 20px;
      text-align: center;
      z-index: 1000;
    }

    #gallery h2 {
      font-size: 2.2em;
      color: #ffa500;
      margin-bottom: 40px;
      animation: slideInUp 0.8s ease-out;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.5s ease-in-out;
      aspect-ratio: 4/3;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1100;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease-in-out;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 165, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      z-index: 1101;
    }

    .card:hover::after {
      opacity: 1;
    }

    /* ===== Footer ===== */
    footer {
      background: rgba(0, 0, 0, 0.9);
      color: #aaa;
      text-align: center;
      padding: 30px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
      animation: slideInUp 0.8s ease-out;
      z-index: 2000;
    }

    footer a {
      color: #ffa500;
      text-decoration: none;
      transition: color 0.3s ease-in-out, transform 0.3s ease-in-out;
      z-index: 2100;
    }

    .neil {
      color: #ff9900;
      font-weight: bold;
    }

    footer a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== Animations ===== */
    @keyframes slideInHeader {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInContent {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 0 5px rgba(255, 165, 0, 0.5);
      }
      50% {
        text-shadow: 0 0 15px rgba(255, 165, 0, 1);
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 8px rgba(255, 165, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 15px rgba(255, 165, 0, 1);
      }
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px;
      }

      nav ul {
        justify-content: flex-start;
        gap: 15px;
      }

      .parallax h2 {
        font-size: 1.8em;
      }

      .parallax p {
        font-size: 1em;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Toxy CSE" id="logo">
      <h1>TOXY CSE</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#about">About Us</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero -->
  <section class="parallax hero" style="background-image: url('https://e.top4top.io/p_3542t91rl0.jpg');">
    <div class="overlay"></div>
    <div class="hero-content">
      <h2>Welcome to <span class="highlight">TOXY CSE</span></h2>
      <p>The boys from Toxy CSE</p>
      <a href="https://www.instagram.com/toxy.cse/" class="btn">Follow us on Instagram</a>
    </div>
  </section>

  <!-- About -->
  <section id="about" class="parallax" style="background-image: url('https://i.ibb.co/WyBmgM2/456574239-1006834264517911-8848268185205471032-n.jpg');">
    <div class="overlay"></div>
    <div class="content">
      <h2>About Us</h2>
      <p>Department of CSE | 2022 - 2026 batch</p>
    </div>
  </section>

  <!-- Gallery -->
  <section id="gallery">
    <h2>Gallery</h2>
    <div class="gallery-grid">
      <div class="card"><img src="https://i.ibb.co/WyBmgM2/456574239-1006834264517911-8848268185205471032-n.jpg" alt="Gallery 1"></div>
      <div class="card"><img src="https://i.ibb.co/1XnQWtV/428970425-240976232413395-3054693785549047076-n.jpg" alt="Gallery 2"></div>
      <div class="card"><img src="https://i.ibb.co/xfTvzK6/toxy.jpg" alt="Gallery 3"></div>
      <div class="card"><img src="https://i.postimg.cc/W4jqpSxD/345924540-1481570369251024-7843852771591109727-n.jpg" alt="Gallery 4"></div>
      <div class="card"><img src="https://i.postimg.cc/htfk2v21/IMG-5059.jpg" alt="Gallery 5"></div>
      <div class="card"><img src="https://i.postimg.cc/d3RCPJnW/Whats-App-Image-2024-09-01-at-12-11-50-PM-1.jpg" alt="Gallery 6"></div>
      <div class="card"><img src="https://i.postimg.cc/rFLbSg4c/IMG-5035.jpg" alt="Gallery 7"></div>
      <div class="card"><img src="https://i.postimg.cc/1tmXnDKK/IMG-20230701-WA0009-2.jpg" alt="Gallery 8"></div>
    </div>
  </section>

  <!-- Background Music -->
  <audio id="bg-music" loop autoplay>
    <source src="SHERIYA.mp3" type="audio/mpeg">
  </audio>

  <!-- Contact -->
  <section id="contact" class="parallax" style="background-image: url('https://i.postimg.cc/htfk2v21/IMG-5059.jpg');">
    <div class="overlay"></div>
    <div class="content">
      <h2>Contact Us</h2>
      <p>Email: <a class="email" href="mailto:toxycse@gmail.com">toxycse@gmail.com</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <span>DEVELOPED BY </span><a href="https://instagram.com/neilna7h" class="neil">NEIL</a>
    <p>&copy; 2024 TOXY CSE</p>
  </footer>

  <script>
    // Smooth Scroll for Nav Links
    document.querySelectorAll('nav a').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        const targetElement = document.querySelector(targetId);
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      anchor.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        const targetElement = document.querySelector(targetId);
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // Intersection Observer for Scroll Animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.animationPlayState = 'running';
          entry.target.classList.add('animate');
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.parallax, .card').forEach(element => {
      element.style.animationPlayState = 'paused';
      observer.observe(element);
    });

    // Handle Background Music Autoplay
    document.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bg-music');
      audio.play().catch(error => {
        console.error('Autoplay failed:', error);
        // Attempt to play on user interaction with the page
        document.addEventListener('click', () => {
          audio.play().catch(err => console.error('Click-triggered play failed:', err));
        }, { once: true });
        document.addEventListener('touchstart', () => {
          audio.play().catch(err => console.error('Touch-triggered play failed:', err));
        }, { once: true });
      });
    });

    // Ensure buttons are clickable
    document.querySelectorAll('.btn, .email').forEach(button => {
      button.addEventListener('touchstart', function(e) {
        e.stopPropagation();
      });
    });
  </script>
</body>
</html>
