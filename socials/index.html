<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Freshers</title>
  <style>
    /* ===== Base ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #222;
      background: linear-gradient(135deg, #ffffff, #f5f5f7);
      overflow-x: hidden;
    }

    /* ===== Background Animation ===== */
    .parallax-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #000000, #444444);
      opacity: 0.1;
      z-index: -1;
      animation: subtlePulse 12s ease-in-out infinite;
    }

    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 0.1; }
      50% { transform: scale(1.05); opacity: 0.2; }
    }

    /* ===== Header ===== */
    header {
      background: #111;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 10;
      animation: slideInDown 0.8s ease-out;
    }
    header h1 {
      margin: 0;
      font-size: 2.2em;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }

    /* ===== Card Container ===== */
    .container {
      max-width: 1000px;
      margin: 60px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 20px;
    }

    /* ===== Cards ===== */
    .card {
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 18px 22px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-left: 6px solid #ff8800;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.2);
    }

    .card img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      margin-right: 20px;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.1) rotate(3deg);
    }

    .card h3 {
      margin: 0;
      font-size: 1.4em;
      color: #222;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .card:hover h3 {
      color: #ff8800;
    }

    .cyber {
      border-radius: 50%;
      background-color: #000000;
    }

    /* ===== Footer ===== */
    footer {
      background: #111;
      color: #bbb;
      text-align: center;
      padding: 25px;
      margin-top: 60px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
      animation: slideInUp 0.8s ease-out;
    }
    footer p {
      margin: 0;
      font-size: 1em;
    }

    /* ===== Animations ===== */
    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-60px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(60px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .card {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }
      .card img {
        margin: 0 0 15px 0;
      }
    }
  </style>
</head>
<body>
  <div class="parallax-bg"></div>

  <header>
    <h1>Welcome Freshers</h1>
  </header>

  <div class="container">
    <div class="card" onclick="openLink('https://www.instagram.com/_aur.um/')">
      <img src="https://i.ibb.co/jkD434gZ/weight.png" alt="Aurum">
      <h3>AURUM</h3>
    </div>

    <div class="card" onclick="openLink('https://toxycse.github.io')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Toxy CSE">
      <h3>TOXY CSE</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_crusaders_')">
      <img class="crusaders" src="https://i.ibb.co/BHqM0FXk/440832927-806685830934036-4370578088332019033-n.jpg" alt="CSE Crusaders">
      <h3>CSE CRUSADERS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/mannar.___')">
      <img class="cyber" src="https://i.ibb.co/RW9HQVc/1757254079290.png" alt="Mannar">
      <h3>MANNAR</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_retnox')">
      <img src="https://i.ibb.co/bMMbZWpC/1000245407.png" alt="CSE Retnox">
      <h3>CSE RETNOX</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_celestials')">
      <img src="https://i.ibb.co/NgSMnymn/IMG-6779.jpg" alt="CSE Celestials">
      <h3>CSE CELESTIALS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cylox_tm/')">
      <img src="https://i.ibb.co/s9B0HzfD/1000015229.jpg" alt="Cylox">
      <h3>CYLOX</h3>
    </div>
  </div>

  <footer>
    <p>Welcome to our Department</p>
  </footer>

  <script>
    function openLink(url) {
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
