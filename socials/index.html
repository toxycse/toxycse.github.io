<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCIALS</title>
  <style>
    /* ===== Base ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #ffa500;
      padding: 15px 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2em;
      color: #fff;
    }

    /* ===== Card Container ===== */
    .container {
      max-width: 800px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 15px;
    }

    /* ===== Cards ===== */
    .card {
      background: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 15px 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s forwards;
    }
    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.4s; }
    .card:nth-child(3) { animation-delay: 0.6s; }
    .card:nth-child(4) { animation-delay: 0.8s; }
    .card:nth-child(5) { animation-delay: 1s; }
    .card:nth-child(6) { animation-delay: 1.2s; }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-right: 20px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.3em;
      color: #333;
      font-weight: 600;
    }

    /* ===== Footer ===== */
    footer {
      background: #ffa500;
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      margin-top: 40px;
    }

    /* ===== Animations ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome</h1>
  </header>

  <div class="container">
    <div class="card" onclick="openLink('https://www.instagram.com/group1/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 1">
      <h3>TOXY CSE</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group2/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 2">
      <h3>CSE CRUSADERS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group3/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 3">
      <h3>CLASS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group4/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 4">
      <h3>SEM 4 - B</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group5/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 5">
      <h3>SEM 5 - A</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group6/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 6">
      <h3>SEM 6 - B</h3>
    </div>
  </div>
  <script>
    function openLink(url) {
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
