<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Freshers</title>
  <style>
    /* ===== Base ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #333;
      overflow-x: hidden;
      background: #fff; /* Changed to white background */
      perspective: 1000px; /* Added for 3D effects */
    }

    .crusaders {
      border-radius: 50px;
    }

    header {
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      animation: slideInDown 1s ease-out;
    }
    header h1 {
      margin: 0;
      font-size: 2.5em;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      transform: translateZ(20px); /* 3D effect */
    }

    .cyber {
      background-color: black;
      border-radius: 50px;
    }

    /* ===== Card Container ===== */
    .container {
      max-width: 900px;
      margin: 50px auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* ===== Cards ===== */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      display: flex;
      align-items: center;
      padding: 20px 25px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
      opacity: 0;
      transform: translateY(50px) rotateX(10deg); /* 3D tilt */
      animation: cardPopIn 0.8s ease-out forwards;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 165, 0, 0.3);
    }
    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.4s; }
    .card:nth-child(3) { animation-delay: 0.6s; }
    .card:nth-child(4) { animation-delay: 0.8s; }
    .card:nth-child(5) { animation-delay: 1.0s; }
    .card:nth-child(6) { animation-delay: 1.2s; }

    .card:hover {
      transform: translateY(-10px) rotateX(0deg) scale(1.05); /* Smooth 3D hover */
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      background: rgba(255, 255, 255, 1);
    }

    .card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-right: 25px;
      transition: transform 0.4s ease;
      border-radius: 10px;
    }

    .card:hover img {
      transform: scale(1.2) rotate(5deg); /* Enhanced image animation */
    }

    .card h3 {
      margin: 0;
      font-size: 1.5em;
      color: #333;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .card:hover h3 {
      color: #ff6f00; /* Orange text on hover */
    }

    /* ===== Footer ===== */
    footer {
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 1em;
      margin-top: 50px;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(8px);
      box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.15);
      animation: slideInUp 1s ease-out;
    }

    /* ===== Animations ===== */
    @keyframes cardPopIn {
      from {
        opacity: 0;
        transform: translateY(50px) rotateX(10deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0deg);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-100px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(100px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Parallax background effect */
    .parallax-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #000000, #fff);
      z-index: -1;
      animation: subtlePulse 10s ease-in-out infinite;
    }

    @keyframes subtlePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="parallax-bg"></div>

  <header>
    <h1>Welcome Freshers</h1>
  </header>

  <div class="container">
    <div class="card" onclick="openLink('https://toxycse.github.io')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Toxy CSE">
      <h3>TOXY CSE</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_crusaders_')">
      <img class="crusaders" src="https://i.ibb.co/BHqM0FXk/440832927-806685830934036-4370578088332019033-n.jpg" alt="cse crusaders">
      <h3>CSE CRUSADERS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/mannar.___')">
      <img class="cyber" src="https://i.ibb.co/RW9HQVc/1757254079290.png" alt="Group 3">
      <h3>MANNAR</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_retnox')">
      <img src="https://i.ibb.co/bMMbZWpC/1000245407.png" alt="Group 4">
      <h3>CSE RETNOX</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/cse_celestials')">
      <img src="https://i.ibb.co/NgSMnymn/IMG-6779.jpg" alt="Group 5">
      <h3>CSE CELESTIALS</h3>
    </div>

    <div class="card" onclick="openLink('https://www.instagram.com/group6_2022/')">
      <img src="https://i.postimg.cc/9M2fYMcr/logo-toxy.png" alt="Group 6">
      <h3>SEM 5 - B</h3>
    </div>
  </div>

  <footer>
    <p>Welcome to our Department</p>
  </footer>

  <script>
    function openLink(url) {
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
